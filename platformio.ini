; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo_f401re

[env]
platform = ststm32
board = nucleo_f401re
framework = arduino

build_flags =
  -I ./lib
  -I ./lib/python_mpc_to_cpp/python_mpc
  -I ./lib/python_mpc_to_cpp/mpc_utility
  -I ./lib/python_optimization_to_cpp/optimization_utility
  -I ./lib/python_optimization_to_cpp/python_optimization
  -I ./lib/python_control_to_cpp/python_control
  -I ./lib/python_numpy_to_cpp/base_matrix
  -I ./lib/python_numpy_to_cpp/python_numpy
  -I ./lib/python_math_to_cpp/base_math
  -I ./lib/python_math_to_cpp/python_math
  -I ./lib/base_utility_cpp/base_utility
  -I ./src
  -I ./src/Tester
  -I ./include
  -I ./include/Tester
  -I ./include/Tester/mpc/lti_mpc
  -I ./include/Tester/mpc/lti_mpc_instant
  -I ./include/Tester/mpc/lti_mpc_no_constraints
  -I ./include/Tester/mpc/ltv_mpc
  -I ./include/Tester/mpc/ltv_mpc_no_constraints
  -I ./include/Tester/mpc/adaptive_mpc_no_constraints
  -I ./include/Tester/mpc/adaptive_mpc
  -I ./include/Tester/mpc/nonlinear_mpc_optimization_engine
  -I ./include/Tester/mpc/nonlinear_mpc_twice_differentiable

custom_test_define = HARDWARE_TEST_ADAPTIVE_MPC
custom_tester_source = Tester/Python_Adaptive_MPC_Tester.cpp

build_src_flags = -D ${this.custom_test_define}
build_src_filter =
  +<*>
  -<Tester/>
  +<${this.custom_tester_source}>

[env:nucleo_f401re]
; Uses the adaptive MPC tester configured in [env].

[env:lti_mpc]
custom_test_define = HARDWARE_TEST_LTI_MPC
custom_tester_source = Tester/Python_LTI_MPC_Tester.cpp

[env:lti_mpc_instant]
custom_test_define = HARDWARE_TEST_LTI_MPC_INSTANT
custom_tester_source = Tester/Python_LTI_MPC_Instant_Tester.cpp

[env:ltv_mpc]
custom_test_define = HARDWARE_TEST_LTV_MPC
custom_tester_source = Tester/Python_LTV_MPC_Tester.cpp

[env:nonlinear_mpc_twice_differentiable]
custom_test_define = HARDWARE_TEST_NONLINEAR_MPC_TWICE_DIFFERENTIABLE
custom_tester_source = Tester/Python_Nonlinear_MPC_Twice_Differentiable_Tester.cpp

[env:nonlinear_mpc_optimization_engine]
custom_test_define = HARDWARE_TEST_NONLINEAR_MPC_OPTIMIZATION_ENGINE
custom_tester_source = Tester/Python_Nonlinear_MPC_Optimization_Engine_Tester.cpp
