name: Build

on:
  push:
    branches:
    - develop

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
        - nucleo_f401re
        - lti_mpc
        - lti_mpc_instant
        - ltv_mpc
        - nonlinear_mpc_twice_differentiable
        - nonlinear_mpc_optimization_engine

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
        restore-keys: ${{ runner.os }}-platformio-
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Install PlatformIO
      run: pip install platformio
    - name: Build Nucleo F401RE firmware
      run: pio run -e ${{ matrix.environment }}
